<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.png" />
    <title>Kliuye — fishing bite forecast</title>
    <meta
      name="description"
      content="Kliuye: is it worth going fishing today? The answer at a glance."
    />
    <style>
      :root {
        --bg: #0c3f45;
        --text: #f1f5ec;
        --muted: rgba(241, 245, 236, 0.75);
        --lure: #d6ff3d;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font:
          17px/1.6 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      main {
        max-width: 560px;
        padding: 32px 16px;
      }
      h1 {
        font-size: 3rem;
        margin: 0;
      }
      p {
        color: var(--muted);
      }
      a {
        color: var(--lure);
        font-weight: 600;
      }
      a:focus-visible {
        outline: 3px solid var(--lure);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Kliuye</h1>
      <p>
        A bite forecast for anglers: a 0–100 index for today and the week ahead, the best time
        window, a map of waters and a catch journal. No accounts, no ads, no tracking.
      </p>
      <p>
        <a href="privacy/#en">Privacy Policy</a> ·
        <a href="privacy/#uk" lang="uk">Політика приватності</a> ·
        <a href="privacy/#bg" lang="bg">Политика за поверителност</a>
      </p>
      <p>Contact: <a href="mailto:dmtro.kravchenko@gmail.com">dmtro.kravchenko@gmail.com</a></p>
    </main>
  </body>
</html>

name: EAS build

# Cloud builds cost EAS quota and need an Expo account, so they run only on
# demand: Actions → EAS build → Run workflow. Day to day, the Play upload is
# built locally and signed with the key in secrets/ (see RELEASE.md).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [android, ios, all]
        default: android

jobs:
  build:
    name: EAS build (production, ${{ inputs.platform }})
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Require an Expo token
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::error::Add an EXPO_TOKEN repository secret (expo.dev → Access tokens) first."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: eas build --platform ${{ inputs.platform }} --profile production --non-interactive --no-wait

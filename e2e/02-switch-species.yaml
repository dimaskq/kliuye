# Switching species re-derives the index and the hourly curve.
appId: com.kliuye.app
---
- launchApp
# Put off the location dialog, when it is shown at all.
- tapOn:
    text: 'Пізніше'
    optional: true
- assertVisible: 'Вид риби'
- copyTextFrom:
    id: 'bite-index-value'
    optional: true
- tapOn: 'Щука.*'
- assertVisible: 'Щука.*'
- assertVisible: 'По годинах'

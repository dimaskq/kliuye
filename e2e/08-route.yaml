# The water in view offers a route; the phone's maps app builds it.
appId: com.kliuye.app
---
- launchApp:
    clearState: true
# Put off the location dialog, when it is shown at all.
- tapOn:
    text: 'Пізніше'
    optional: true
- tapOn: 'Мапа'
- assertVisible: 'Де будемо рибачити?'
# Location is optional: the route must be there either way.
- tapOn: 'Маршрут'
- assertVisible: 'Як дістатися до.*'
- assertVisible: 'Авто'
- assertVisible: 'Пішки'
- tapOn: 'Авто'
# The maps app takes over; coming back must leave the screen as it was.
- pressKey: back
- assertVisible: 'Мапа водойм'

# Denying location must leave every screen working, with a manual choice of place.
appId: com.kliuye.app
---
- launchApp:
    clearState: true
    permissions:
      location: deny
# Put off the location dialog, when it is shown at all.
- tapOn:
    text: 'Пізніше'
    optional: true
- assertVisible: 'Індекс кльову'
- tapOn: 'Мапа'
- assertVisible: 'Де будемо рибачити?'
- tapOn: 'Відкрити'
- assertVisible: 'Індекс кльову'

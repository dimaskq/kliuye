# The week list expands one day at a time.
appId: com.kliuye.app
---
- launchApp
# Put off the location dialog, when it is shown at all.
- tapOn:
    text: 'Пізніше'
    optional: true
- tapOn: 'Тиждень'
- assertVisible: 'Прогноз кльову.*'
- tapOn:
    text: '.*індекс.*'
    index: 2
- assertVisible: 'Вікно.*'
- assertVisible: 'Вітер.*'
- assertVisible: 'Тиск.*'
